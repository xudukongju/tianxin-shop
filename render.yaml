# Render 一键部署配置（免费版自带 HTTPS，WebSocket 同源）
# 部署方式：在 Render 新建 Web Service → 连接 GitHub 仓库 → 选本文件所在仓库 → Render 自动识别此配置
services:
  - type: web
    name: tianxin-shop
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node --experimental-sqlite sync-server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
    pullRequestPreviewsEnabled: false
