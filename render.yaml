# Render 部署配置（自带 HTTPS，WebSocket 同源）
# 部署方式：在 Render 新建 Web Service → 连接 GitHub 仓库 → 选本文件所在仓库 → Render 自动识别此配置
# 或直接点 README 里的「Deploy to Render」按钮一键部署。
services:
  - type: web
    name: tianxin-shop
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node --experimental-sqlite sync-server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
    pullRequestPreviewsEnabled: false
    # ⚠️ 持久化磁盘：仅在付费计划(Starter 及以上)可用。
    #    免费计划请删除下面这段 disk 配置再部署，否则会报错。
    #    挂载到 server 目录，使 tianxin.db (房间数据) 与 vapid.json 持久保存。
    disk:
      name: tianxin-data
      mountPath: /opt/render/project/src/server
      sizeGB: 1
